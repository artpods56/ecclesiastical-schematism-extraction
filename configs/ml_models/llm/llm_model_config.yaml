backend:
  type: openrouter
  max_retries: 5
clients:
  openrouter:
    backend: openrouter
    model: "google/gemini-3-flash-preview"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env_var: "OPENROUTER_API_KEY"
    structured_output: false
    template_dir: prompts
    params:
      max_tokens: 4096
      temperature: 0.1
      top_p: 0.9
