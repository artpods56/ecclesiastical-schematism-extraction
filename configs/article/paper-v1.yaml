vision_model:
  provider: "openrouter"
  model_id: "google/gemini-3-flash-preview"
  base_url: "https://openrouter.ai/api/v1"
  api_key_environment_variable: "OPENROUTER_API_KEY"
  temperature: 0.1
  top_p: 0.9
  max_tokens: 4096

ocr:
  vision_markdown_enabled: true
  tesseract_languages: "lat+pol+rus"
  tesseract_role: "word_coordinates_for_layoutlmv3"
  prompt:
    version: "0.0.1"
    system:
      path: "src/notarius/infrastructure/llm/prompts/tasks/ocr/system.j2"
      sha256: "66a217a1c286f987afffacf576ce46f67d3b7f67e62811c683d83860f14b19a2"
    user:
      path: "src/notarius/infrastructure/llm/prompts/tasks/ocr/user.j2"
      sha256: "eebd66328ce5f0b2ece934bf6360a4db50dbeef18b2d4af0c1a628e49e65dd35"

layoutlmv3:
  checkpoint: "layoutlmv3_focalloss_4000"
  enabled_for_corpus_evaluation: false
  role: "optional_untrusted_hints"

extraction:
  task_name: "structured_extraction"
  context_strategy: "sliding_window"
  context_window_size: 5
  pass_previous_page_context: true
  pass_next_page_ocr: true
  strip_images_from_retained_history: true
  strip_next_page_ocr_from_retained_history: true
  prompt:
    version: "0.0.3"
    system:
      path: "src/notarius/infrastructure/llm/prompts/tasks/structured_extraction/system.j2"
      sha256: "c9deab6b31afb40e43461a718679261d99109c50bc33875f7ca15f8bd960ece1"
    user:
      path: "src/notarius/infrastructure/llm/prompts/tasks/structured_extraction/user.j2"
      sha256: "3dab201778c5df9cf7d6bb86f2893f13c5cbd1cebfa0dd2b5b9267c31cf9fd36"

parsing:
  enabled: true
  mapping_files:
    building_material: "data/mappings/building_material.json"
    dedication: "data/mappings/dedication.json"
    deanery: "data/mappings/deanery.json"

alignment:
  algorithm: "hungarian"
  threshold: 0.5
  weights:
    deanery: 1.0
    parish: 2.0
    dedication: 1.5
    building_material: 0.5

evaluation:
  fields:
    - "page_number"
    - "deanery"
    - "parish"
    - "dedication"
    - "building_material"
  source_form_scorer: "normalized_levenshtein"
  parsed_form_scorer: "exact_match"
  parsed_match_threshold: 1.0
  random_seed: 42
